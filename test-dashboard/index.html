}

// Recordings are offered as MP4 (H.264) first, which VS Code's built-in browser can play, then the original
// WebM. If neither plays, the "can't play" message after the video is shown.
function videoTag(webmUrl, cls = '') {
  const mp4Url = webmUrl.replace(/\.webm$/i, '.mp4');
  return `<video ${cls ? `class="${cls}"` : ''} controls preload="metadata">
    <source src="${mp4Url}" type="video/mp4">
    <source src="${webmUrl}" type="video/webm" onerror="const v=this.parentNode;v.hidden=true;if(v.nextElementSibling)v.nextElementSibling.hidden=false">
  </video>`;
}

// ---------- Video action list ----------
// Every browser action and assertion with its time in the video; clicking one glides the video to that moment.
const fmtClock = ms => { const s = ms / 1000; return `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`; };
const ACT_ICONS = {
  click: '<path d="M9 3v8M5.5 6.5 9 3l3.5 3.5"/><path d="M9 11l6 10 2-5 5-2z"/>',
  fill: '<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 12h1M11 12h6"/>',
  nav: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  expect: '<path d="M4 12l5 5L20 6"/>',
  other: '<circle cx="12" cy="12" r="3"/>',
};
function actIcon(a) {
  const k = a.kind === 'expect' ? 'expect' : /^click|^dblclick|^tap|^check|^uncheck|^hover/i.test(a.title) ? 'click' : /^fill|^type|^press|^select|^set input/i.test(a.title) ? 'fill' : /^navigate|^go to|^reload|^go back|^wait for (url|load|navigation)/i.test(a.title) ? 'nav' : 'other';
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ACT_ICONS[k]}</svg>`;
}
function renderActionList(t) {
  const acts = t.actions || [];
  if (!acts.length) return '<div class="loc">No action list for this recording. Runs recorded before the list was added don’t have one; new runs do.</div>';
  const count = acts.filter(a => a.kind !== 'step').length;
  let section = null;
  const rows = acts.map((a, i) => {
    if (a.kind === 'step') { section = a.title; return `<div class="act-section"><span class="dot ${a.failed ? 'failed' : 'passed'}"></span>${esc(a.title)}<span style="margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0">${fmtClock(a.t)}</span></div>`; }
    return `<button class="act ${a.failed ? 'failed' : ''}" data-seek="${a.t}" data-act="${i}" title="Jump to ${fmtClock(a.t)} in the video">
      <span class="act-time">${fmtClock(a.t)}</span><span class="act-icon">${actIcon(a)}</span>
      <span class="act-title">${esc(a.title)}</span><span class="act-dur">${fmtDur(a.duration)}</span>
      ${a.code ? `<span class="act-code">${esc(a.code)}</span>` : ''}
    </button>`;
  }).join('');
  return `<div class="acts"><div class="acts-head"><b>Actions</b><span>${count} action${count === 1 ? '' : 's'} · click one to jump the video there</span></div><div class="acts-list">${rows}</div></div>`;
}

// Glide the playhead to the target instead of jumping, so you can see where you're moving from.
function smoothSeek(video, seconds) {
  cancelAnimationFrame(video._seekRaf);
  const target = Math.max(0, Math.min(seconds, isFinite(video.duration) ? video.duration - 0.05 : seconds));
  const from = video.currentTime || 0, dist = target - from;
  if (Math.abs(dist) < 0.05) { video.currentTime = target; return; }
  const wasPlaying = !video.paused && !video.ended;
  video.pause();
  const ms = Math.min(700, 250 + Math.abs(dist) * 60), t0 = performance.now();
  const tick = now => {
    const k = Math.min(1, (now - t0) / ms), eased = 1 - Math.pow(1 - k, 3);
    // Skip intermediate frames while the browser is still decoding the last seek.
    if (k === 1 || !video.seeking) video.currentTime = from + dist * eased;
    if (k < 1) video._seekRaf = requestAnimationFrame(tick);
    else if (wasPlaying) video.play();
  };
  video._seekRaf = requestAnimationFrame(tick);
}

// Highlight the action at the playhead and keep it in view while the video plays or seeks.
function wireVideoActions() {
  const video = document.querySelector('.detail video'), list = document.querySelector('.detail .acts-list');
  if (!video || !list || video._wired) return;
  video._wired = true;
  const buttons = [...list.querySelectorAll('[data-seek]')];
  let last = null;
  const sync = () => {
    const now = video.currentTime * 1000 + 30;
    const cur = buttons.filter(b => Number(b.dataset.seek) <= now).at(-1) || null;
    if (cur === last) return;
    last?.classList.remove('current'); cur?.classList.add('current'); last = cur;
    if (cur) {
      const top = cur.offsetTop - list.offsetTop, bottom = top + cur.offsetHeight;
      if (top < list.scrollTop || bottom > list.scrollTop + list.clientHeight) list.scrollTo({ top: top - list.clientHeight / 2 + cur.offsetHeight / 2, behavior: 'smooth' });
    }
  };
  const loop = () => { sync(); if (!video.paused) video._syncRaf = requestAnimationFrame(loop); };
  video.addEventListener('play', loop);
  video.addEventListener('seeked', sync);
  video.addEventListener('timeupdate', sync);
}

// ---------- AI analysis ----------
// "Analyse" runs Claude Code on the latest failed attempt (using your Claude subscription). The verdict is one of
// UI change / timing / app bug / unclear. A proposed test fix or bug report is only applied when you approve it.
const AI_LABEL = { ui_change: 'UI change', timing: 'Timing issue', app_bug: 'App bug', unclear: 'Unclear' };
const AI_CLASS = { ui_change: 'running', timing: 'investigate', app_bug: 'bugged', unclear: '' };
function renderAnalysis(t) {
  const a = t.analysis, live = S.viewedId === S.liveId;
  const intro = '<p>Claude reads this failure (logs, steps, actions, page snapshot, screenshot, the test and app code, and recent app changes) and says whether it looks like a UI change, a timing issue or an app bug. Any fix or bug report it suggests is only applied when you approve it.</p><p class="loc">Runs Claude Code with your Claude subscription, so it uses your plan’s usage. It can only read files: no commands, no edits, and .env files are blocked. Usually takes about a minute.</p>';
  const analyseBtn = (label = 'Analyse') => live ? '<span class="loc">Available when the run finishes.</span>' : `<button class="btn small primary" data-ai="start">${label}</button>`;
  if (!a) return `<div class="ai"><div class="ai-head">AI analysis</div>${intro}<div class="actions">${analyseBtn()}</div></div>`;
  if (a.status === 'running') return `<div class="ai"><div class="ai-head"><span class="dot running"></span>Analysing attempt ${a.attempt}… <span class="loc" id="aiElapsed" data-since="${a.startedAt}">${fmtDur(Date.now() - a.startedAt)}</span></div>
    <p>Claude is reading the failure and the code. You can keep using the dashboard; the result appears here when it’s ready.</p>
    <div class="actions"><button class="btn small" data-ai="cancel">Cancel</button></div></div>`;
  if (a.status !== 'done') return `<div class="ai"><div class="ai-head">AI analysis <span class="badge">${a.status === 'cancelled' ? 'Cancelled' : 'Failed'}</span></div>
    ${a.error && a.status !== 'cancelled' ? `<pre class="error mono">${esc(a.error)}</pre>` : ''}<div class="actions">${analyseBtn('Analyse again')}</div></div>`;

  const r = a.result, cat = r.category;
  const edits = (cat === 'ui_change' || cat === 'timing') ? r.edits || [] : [];
  const action = edits.length ? `<div class="ai-section"><div class="section-label">Proposed test change</div>
        <p>${esc(r.fix_description)}</p>
        ${edits.map(e => `<div class="ai-diff"><div class="ai-diff-file mono">${esc(e.file)}</div><pre class="mono">${e.find.split('\n').map(l => `<span class="del">- ${esc(l)}</span>`).join('\n')}\n${e.replace.split('\n').map(l => `<span class="add">+ ${esc(l)}</span>`).join('\n')}</pre></div>`).join('')}
        <div class="actions">${a.appliedAt ? `<span class="pill passed">Applied ${esc(fmtAgo(a.appliedAt))}</span>${live ? '' : '<button class="btn small" data-ai="retry">↻ Retry the test</button>'}`
          : `<button class="btn small primary" data-ai="apply">Apply fix</button><button class="btn small" data-ai="apply-retry">Apply and retry</button>`}</div></div>`
    : cat === 'app_bug' ? renderBugSuggestion(t, r, live)
    : '';
  return `<div class="ai">
    <div class="ai-head"><span class="pill ${AI_CLASS[cat]}">${AI_LABEL[cat] || cat}</span><span class="loc">${esc(r.confidence)} confidence · attempt ${a.attempt} · ${fmtDur(a.durationMs)}${a.model ? ' · ' + esc(a.model) : ''}</span>
      <span class="spacer"></span>${live ? '' : '<button class="btn small" data-ai="start">Analyse again</button>'}</div>
    <p class="ai-summary">${esc(r.summary)}</p>
    <div class="ai-section"><div class="section-label">Likely cause</div><p>${esc(r.cause)}</p></div>
    ${r.evidence?.length ? `<div class="ai-section"><div class="section-label">Evidence</div><ul>${r.evidence.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}
    ${action}
  </div>`;
}

// For an app bug: an existing report with the same cause comes first (adding to it, reopening it if closed),
// with the drafted new report as the alternative. Once the test is bugged, just say where it went.
function renderBugSuggestion(t, r, live) {
  const draft = (label, primary) => `<div class="ai-section"><div class="section-label">${label}</div>
      <p><b>${esc(r.bug_title)}</b></p><div class="ai-draft">${esc(r.bug_description)}</div>
      ${t.bug || live ? '' : `<div class="actions"><button class="btn small ${primary ? 'primary' : ''}" data-ai="bug">Create new report…</button></div>`}</div>`;
  if (t.bug) return `<div class="ai-section"><div class="actions"><span class="pill bugged">Bugged: ${esc(bugLabel(t.bug.number))}</span></div></div>`;
  const match = r.matching_bug_id && S.bugs.find(b => b.id === r.matching_bug_id);
  if (!match) return draft('Draft bug report', true);
  const closed = match.status === 'closed';
  return `<div class="ai-section ai-match"><div class="section-label">Matches an existing report</div>
      <p><a class="buglink" href="#bugs=${esc(match.id)}">${bugLabel(match.number)} · ${esc(match.title)}</a> <span class="pill ${esc(match.status)}">${closed ? 'Closed' : 'Open'}</span>
        <span class="loc">${match.tests.includes(t.id) ? 'Already includes this test' : `${match.tests.length} other test${match.tests.length === 1 ? '' : 's'}`} · ${match.occurrences} occurrence${match.occurrences === 1 ? '' : 's'}</span></p>
      <p>${esc(r.match_reason)}</p>
      ${live ? '' : `<div class="actions"><button class="btn small primary" data-ai="link">${closed ? 'Reopen and add to' : 'Add to'} ${bugLabel(match.number)}…</button></div>`}</div>
    ${draft('Or create a new report', false)}`;
}

// Apply the proposed find/replace edits through the same save path as the Code tab: files under tests/ only,
// refused if a file changed on disk in between. Every edit is checked before anything is written.
async function applyAiFix(test) {
  const edits = test.analysis?.result?.edits || [];
  const byFile = new Map();
  for (const e of edits) (byFile.get(e.file) || byFile.set(e.file, []).get(e.file)).push(e);
  const updates = [];
  for (const [file, list] of byFile) {
    const src = await api('/api/source?path=' + encodeURIComponent(file));
    let text = src.content;
    for (const e of list) {
      const count = text.split(e.find).length - 1;
      if (count !== 1) throw new Error(`Couldn't apply the fix to ${file}: the text to replace was found ${count} times (expected once). The file may have changed since the analysis; analyse again.`);
      text = text.replace(e.find, () => e.replace);
    }
    updates.push({ src, text });
  }
  for (const { src, text } of updates) {
    const saved = await api('/api/source', { path: src.path, content: text, hash: src.hash });
    // Keep an open Code tab in step, unless it has unsaved edits of its own.
    const entry = CODE.files.get(saved.path);
    if (entry && !isDirty(entry)) { entry.model.setValue(text); Object.assign(entry, { content: text, hash: saved.hash, mtime: saved.mtime, savedVersion: entry.model.getAlternativeVersionId() }); }
  }
  await api('/api/analyse/applied', { runId: S.viewedId, testId: test.id });
  notice(`Applied the fix to ${[...byFile.keys()].join(', ')}.`, true);
}

async function aiAction(action) {
  const test = viewed()?.tests[S.picked]; if (!test) return;
  try {
    if (action === 'start') await api('/api/analyse', { runId: S.viewedId, testId: test.id });
    if (action === 'cancel') await api('/api/analyse/cancel', { runId: S.viewedId, testId: test.id });
    if (action === 'apply' || action === 'apply-retry') { await applyAiFix(test); if (action === 'apply-retry') await retry([test.id]); }
    if (action === 'retry') await retry([test.id]);
    if (action === 'bug' || action === 'link') {
      const r = test.analysis.result;
      openBugDialog(test, { mode: action === 'link' ? 'existing' : 'new', bugId: action === 'link' ? r.matching_bug_id : undefined, title: r.bug_title, description: r.bug_description, attempt: test.analysis.attempt - 1 });
    }
  } catch (e) { notice(e.message); }
}

// Retry tests that need triage inside the viewed run (same settings as the run).

// "Mark as bugged": a new report needs a written description; adding to an existing report takes an optional note.
// Any report can take the failure - another test it breaks, or the same test failing again in a later run - and a
// closed one can be reopened in the same step. If the test is already in a report, that report is suggested first.
// You choose which attempts to attach; each one brings its logs, video, trace and screenshot.
// prefill (from AI analysis): { mode, bugId, title, description, attempt } - attempt is the one to tick.
function openBugDialog(test, prefill = {}) {
  const failed = [...(test.attempts || [])].reverse().find(a => a.state === 'failed') || test;
  const firstLine = (String(failed.errors?.[0]?.message || '').split('\n').find(l => l.trim()) || '').replace(/^\s*Error:\s*/, '');
  // Runs from before attempts were stored have just the one result.
  const attempts = (test.attempts?.length ? [...test.attempts].sort((a, b) => a.retry - b.retry) : [{ ...test, retry: test.retry ?? 0 }]).filter(a => a.state !== 'running');
  const bundle = a => [a.errors?.length && 'logs', ...['video', 'trace', 'screenshot'].filter(k => (a.attachments || []).some(f => f.file && (k === 'trace' ? f.name === 'trace' : k === 'video' ? f.contentType?.startsWith('video/') : f.contentType?.startsWith('image/'))))].filter(Boolean);
  const preselected = prefill.attempt ?? failed.retry ?? attempts.at(-1)?.retry;
  const attemptRows = attempts.map(a => `<label class="att-pick">
      <input type="checkbox" name="att" value="${a.retry}" ${a.retry === preselected ? 'checked' : ''}>
      <span class="dot ${esc(a.state)}"></span><b>Attempt ${a.retry + 1}</b><span>${esc(LABEL[a.state] || a.state)}${a.duration != null ? ' · ' + fmtDur(a.duration) : ''}</span>
      <span class="att-has">${bundle(a).join(' · ') || 'no data recorded'}</span>
    </label>`).join('');
  // Reports that already include this test come first, then open before closed, newest first.
  const has = b => b.tests.includes(test.id);
  const reports = [...S.bugs].sort((a, b) => (has(b) - has(a)) || ((a.status === 'closed') - (b.status === 'closed')) || b.number - a.number);
  const previous = reports.find(has);
  const suggested = reports.find(b => b.id === prefill.bugId) || previous || reports[0];
  let mode = reports.length && (prefill.mode === 'existing' || (!prefill.mode && previous)) ? 'existing' : 'new';
  const dlg = document.createElement('dialog');
  dlg.className = 'modal';
  dlg.innerHTML = `<form novalidate>
    <div class="modal-head"><h2>Mark as bugged</h2><button type="button" class="btn small" data-close aria-label="Close">✕</button></div>
    <div class="loc">${esc(test.titlePath.join(' › '))} · <span class="mono">${esc(test.file)}:${test.line}</span></div>
    ${previous ? `<div class="hint">This test is already in <a class="buglink" href="#bugs=${esc(previous.id)}">${bugLabel(previous.number)} · ${esc(previous.title)}</a> (${previous.status === 'open' ? 'open' : 'closed'}). If it's the same bug, add this failure there to keep its history together.</div>` : ''}
    <div class="seg"><button type="button" data-mode="new">New report</button><button type="button" data-mode="existing" ${reports.length ? '' : 'disabled title="No reports yet"'}>Add to existing${reports.length ? ` (${reports.length})` : ''}</button></div>
    <div data-pane="new" style="display:grid;gap:12px">
      <label>Title<input name="title" maxlength="200" value="${esc(prefill.title || (test.title + ': ' + firstLine).slice(0, 160))}"></label>
      <label>What's wrong?<textarea name="description" maxlength="20000" placeholder="Describe the bug: what you expected to happen and what happened instead.">${esc(prefill.description || '')}</textarea></label>
    </div>
    <div data-pane="existing" hidden style="display:grid;gap:12px">
      <label>Report<select name="bug">${reports.map(b => `<option value="${esc(b.id)}" ${b === suggested ? 'selected' : ''}>${bugLabel(b.number)} · ${esc(b.title)}${b.status === 'closed' ? ' (closed)' : ''}${has(b) ? ' (already has this test)' : ''}</option>`).join('')}</select></label>
      <label class="check" data-reopen hidden><input type="checkbox" name="reopen" checked> Reopen this report: the bug has come back</label>
      <label>Note (optional)<textarea name="note" maxlength="5000" placeholder="Anything different about this occurrence?"></textarea></label>
    </div>
    <div class="evidence"><b>Attach attempt data</b>
      <span>Each attempt you tick is attached with its logs, video, trace and screenshot.</span>
      <div class="att-list">${attemptRows}</div>
    </div>
    <div class="banner" data-error hidden></div>
    <div class="modal-actions"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary" data-submit>Create report</button></div>
  </form>`;
  document.body.append(dlg);
  const form = dlg.querySelector('form'), errEl = dlg.querySelector('[data-error]');
  const close = () => { dlg.close(); dlg.remove(); };
  const selected = () => reports.find(b => b.id === form.elements.bug?.value);
  const reopening = () => mode === 'existing' && selected()?.status === 'closed' && form.elements.reopen.checked;
  // Show the chosen mode, and offer reopening when the chosen report is closed.
  const sync = () => {
    dlg.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    dlg.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== mode);
    dlg.querySelector('[data-reopen]').hidden = selected()?.status !== 'closed';
    dlg.querySelector('[data-submit]').textContent = mode === 'new' ? 'Create report' : reopening() ? 'Reopen and add' : 'Add to report';
  };
  sync();
  dlg.addEventListener('close', () => dlg.remove());
  dlg.addEventListener('change', sync);
  dlg.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) close();
    const m = e.target.closest('[data-mode]');
    if (m && !m.disabled) { mode = m.dataset.mode; sync(); errEl.hidden = true; }
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(form));
    const showError = msg => { errEl.textContent = msg; errEl.hidden = false; };
    if (mode === 'new' && !v.title.trim()) return showError('Give the report a title.');
    const chosen = [...form.querySelectorAll('input[name=att]:checked')].map(i => Number(i.value));
    if (!chosen.length) return showError('Tick at least one attempt to attach.');
    if (mode === 'new' && v.description.trim().length < 10) return showError('Describe the bug (at least 10 characters) before creating the report.');
    dlg.querySelector('[data-submit]').disabled = true;
    const reopened = reopening();
    try {
      const bug = mode === 'new'
        ? await api('/api/bugs', { runId: S.viewedId, testId: test.id, title: v.title, description: v.description, attempts: chosen })
        : await api(`/api/bugs/${v.bug}/link`, { runId: S.viewedId, testId: test.id, note: v.note, attempts: chosen, reopen: reopened });
      close();
      notice(`Marked as bugged: ${bugLabel(bug.number)}${reopened ? ' (reopened)' : ''}.`, true);
    } catch (err) { showError(err.message); dlg.querySelector('[data-submit]').disabled = false; }
  });
  dlg.showModal();
  dlg.querySelector(mode === 'new' ? 'textarea[name=description]' : 'select').focus();
}

async function loadBugs() {
  S.bugs = await api('/api/bugs').catch(() => []);
  if (S.view === 'bug' && S.bugId) await loadBug(S.bugId);
  update();
}
async function loadBug(id) {
  try { S.bugCache.set(id, await api('/api/bugs/' + id)); } catch { S.bugCache.delete(id); }
}

function renderBugsList() {
  const el = $('#bugRows'); if (!el) return;
  if (!S.bugs.length) { el.innerHTML = '<div class="empty">No bug reports yet. Open a run, pick a test that needs triage and choose “Mark as bugged”.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>Report</th><th>Title</th><th>Status</th><th class="num">Occurrences</th><th class="num">Updated</th></tr></thead><tbody>${S.bugs.map(b => `
    <tr data-bug-id="${esc(b.id)}">
      <td class="mono">${bugLabel(b.number)}</td>
      <td>${esc(b.title)}</td>
      <td><span class="pill ${b.status}">${b.status === 'open' ? 'Open' : 'Closed'}</span></td>
      <td class="num">${b.occurrences}</td>
      <td class="num">${esc(fmtAgo(b.updatedAt))}</td>
    </tr>`).join('')}</tbody></table>`;
}

// One attached attempt on a bug report: its logs (failed step, errors, code snippet), screenshot, video and trace.
// Reports made before attempts could be chosen have a single unlabelled group.
function renderBugAttempt(a, fileUrl, labelled) {
  const files = (a.files || []).filter(f => !aiOnly(f));
  const shots = files.filter(f => f.contentType?.startsWith('image/')), videos = files.filter(f => f.contentType?.startsWith('video/'));
  const trace = files.find(f => f.name === 'trace');
  return `<div class="bug-attempt">
    ${labelled ? `<div class="bug-attempt-head"><span class="dot ${esc(a.state)}"></span><b>Attempt ${a.attempt}</b><span class="loc">${esc(LABEL[a.state] || a.state || '')}${a.duration != null ? ' · ' + fmtDur(a.duration) : ''}</span>
      ${trace ? `<span class="spacer"></span><button class="btn small" data-bug-trace="${esc(trace.file)}">Open trace viewer</button>` : ''}</div>` : ''}
    ${a.step ? `<div class="callout"><span class="dot failed"></span>Failed in step “${esc(a.step)}”</div>` : ''}
    ${(a.errors || []).map(e => `<div>
      ${e.location ? `<div class="section-label mono">${esc(String(e.location.file).split(/[\\/]/).slice(-2).join('/'))}:${e.location.line}:${e.location.column}</div>` : ''}
      <pre class="error mono">${esc(e.message)}</pre>
      ${e.snippet ? `<pre class="mono snippet" style="margin-top:8px">${esc(e.snippet)}</pre>` : ''}
    </div>`).join('')}
    ${shots.length || videos.length ? `<div class="media">${videos.map(x => videoTag(fileUrl(x.file))).join('')}${shots.map(x => `<a href="${fileUrl(x.file)}" target="_blank" rel="noopener"><img loading="lazy" src="${fileUrl(x.file)}" alt="${esc(x.name)}"></a>`).join('')}</div>` : ''}
  </div>`;
}

function renderBug() {
  const el = $('#bugBody'); if (!el) return;
  const b = S.bugCache.get(S.bugId);
  if (!b) { el.innerHTML = '<section class="panel"><div class="empty">This bug report could not be found. <a href="#bugs">Back to all bugs</a></div></section>'; return; }
  const fileUrl = f => `/api/bugs/${encodeURIComponent(b.id)}/files/${encodeURIComponent(f)}`;
  const kept = new Set(S.runs.map(r => r.id));
  el.innerHTML = `<section class="panel">
      <div class="bug-head">
        <div class="row"><span class="mono loc">${bugLabel(b.number)}</span><span class="pill ${b.status}">${b.status === 'open' ? 'Open' : 'Closed'}</span><span class="loc">Reported ${esc(fmtTime(b.createdAt))}</span>${b.reopenedAt ? `<span class="loc">Reopened ${esc(fmtTime(b.reopenedAt))}</span>` : ""}<span class="spacer"></span>
          <button class="btn small" data-bug-status="${b.status === 'open' ? 'closed' : 'open'}">${b.status === 'open' ? 'Close report' : 'Reopen'}</button></div>
        <h2>${esc(b.title)}</h2>
      </div>
      <div class="bug-desc">${esc(b.description)}</div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Occurrences (${b.occurrences.length})</h2></div>
      ${b.occurrences.length ? b.occurrences.slice().reverse().map(o => `<div class="occ">
        <div class="row" style="display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center">
          <b>${esc(o.title)}</b><span class="mono loc">${esc(o.file)}:${o.line}</span>
          <span class="loc">${kept.has(o.runId) ? `<a href="#results=${esc(o.runId)}">Run ${esc(fmtTime(o.runStartedAt))}</a>` : `Run ${esc(fmtTime(o.runStartedAt))} (no longer kept)`} · ${o.attemptData ? `attempt${o.attemptData.length > 1 ? 's' : ''} ${o.attemptData.map(a => a.attempt).join(', ')} of ${o.attempts} attached` : `attempt ${o.attempt} of ${o.attempts}`}</span>
        </div>
        ${o.note ? `<div><div class="section-label">Note</div><div style="white-space:pre-wrap">${esc(o.note)}</div></div>` : ''}
        ${(o.attemptData || [{ step: o.step, errors: o.error ? [{ message: o.error }] : [], files: o.files }]).map(a => renderBugAttempt(a, fileUrl, !!o.attemptData)).join('')}
      </div>`).join('') : '<div class="empty">No tests are linked to this report.</div>'}
    </section>`;
}

// ---------- Code tab (Monaco, the editor VS Code is built on) ----------
// One editor is kept for the page and moved into each Code tab, so edits, undo history and scroll survive re-renders.
const CODE = { loading: null, editor: null, host: null, files: new Map(), context: null, frames: [], current: null, decorations: null, zones: [] };
const normPath = p => String(p || '').replace(/\\/g, '/').toLowerCase();
const sameFile = (a, entry) => normPath(a).endsWith(normPath(entry.path));
// Locations mix absolute paths (errors, steps) and repo-relative ones (the test), so compare by suffix.
const samePath = (a, b) => { const x = normPath(a), y = normPath(b); return x === y || x.endsWith('/' + y) || y.endsWith('/' + x); };
const baseName = p => String(p).split(/[\\/]/).pop();

function ensureMonaco() {
  if (window.monaco) return Promise.resolve(window.monaco);
  CODE.loading ||= new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = '/vendor/monaco/vs/loader.js';
    script.onerror = () => reject(new Error('Could not load the code editor. Run npm install (it needs the monaco-editor dev dependency).'));
    script.onload = () => {
      window.require.config({ paths: { vs: '/vendor/monaco/vs' } });
      window.require(['vs/editor/editor.main'], () => {
        const m = window.monaco;
        const colors = { dark: { 'editor.background': '#0b0d10', 'editorGutter.background': '#0b0d10', 'editor.lineHighlightBackground': '#ffffff08', 'editorLineNumber.foreground': '#4b5563' }, light: { 'editor.background': '#f6f7f9', 'editorGutter.background': '#f6f7f9' } };
        m.editor.defineTheme('dash-dark', { base: 'vs-dark', inherit: true, rules: [], colors: colors.dark });
        m.editor.defineTheme('dash-light', { base: 'vs', inherit: true, rules: [], colors: colors.light });
        // Imports like @playwright/test can't be resolved here, so skip type errors; syntax errors still show.
        const ts = m.languages.typescript || m.typescript;
        ts?.typescriptDefaults?.setDiagnosticsOptions({ noSemanticValidation: true, noSuggestionDiagnostics: true });
        resolve(m);
      }, reject);
    };
    document.head.append(script);
  });
  return CODE.loading;
}

// Where to look: the error location, then every call-stack frame inside tests/, then the test's own line.
function codeFrames(t) {
  const frames = [];
  const add = (file, line, column, kind) => {
    if (!file || !line || !/(^|[\\/])tests[\\/]/.test(file)) return;
    if (frames.some(f => samePath(f.file, file) && f.line === line)) return;
    frames.push({ file, line, column: column || 1, kind });
  };
  const err = t.errors?.[0];
  if (err) {
    add(err.location?.file, err.location?.line, err.location?.column, 'error');
    for (const m of String(err.stack || '').matchAll(/([A-Za-z]:[\\/][^():\n]+|\/[^():\n]+):(\d+):(\d+)/g)) add(m[1], Number(m[2]), Number(m[3]), 'call');
  }
  add('tests/e2e/' + t.file, t.line, 1, 'test');
  return frames;
}

function ideHost() {
  if (CODE.host) return CODE.host;
  const host = document.createElement('div');
  host.className = 'ide';
  host.innerHTML = `<div class="ide-bar"><div class="ide-files"></div><div class="ide-actions">
      <button class="btn small" data-ide="revert" title="Discard unsaved changes">Revert</button>
      <button class="btn small primary" data-ide="save" title="Save to disk (Ctrl+S)">Save</button>
      <a class="btn small" data-ide="vscode" title="Open this file at this line in VS Code">Open in VS Code</a></div></div>
    <div class="ide-stack"></div><div class="ide-note" hidden></div>
    <div class="ide-editor"><div class="ide-loading">Loading editor…</div></div><div class="ide-status"></div>`;
  host.addEventListener('click', e => {
    const fr = e.target.closest('[data-frame]'); if (fr) openFrame(CODE.frames[Number(fr.dataset.frame)]);
    const file = e.target.closest('[data-file-tab]'); if (file) openFrame(CODE.frames.find(f => samePath(f.file, file.dataset.fileTab)) || CODE.frames[0]);
    const act = e.target.closest('[data-ide]')?.dataset.ide;
    if (act === 'save') saveCode();
    if (act === 'revert' && CODE.current) revertCode();
    if (act === 'reload') reloadCode();
  });
  return CODE.host = host;
}

async function mountCode(test, view) {
  const slot = document.getElementById('codeSlot'); if (!slot) return;
  const host = ideHost();
  if (host.parentNode !== slot) slot.append(host);
  const key = [S.viewedId, test.id, view.retry].join(':');
  if (CODE.context === key && CODE.editor) return;
  CODE.context = key;
  CODE.frames = codeFrames(view);
  CODE.steps = view.steps || [];
  CODE.error = view.errors?.[0] || null;
  CODE.runStartedAt = viewed()?.startedAt || 0;
  renderIde();
  let m;
  try { m = await ensureMonaco(); }
  catch (e) { host.querySelector('.ide-editor').innerHTML = `<div class="ide-loading">${esc(e.message)}</div>`; return; }
  if (!CODE.editor) {
    const el = host.querySelector('.ide-editor'); el.innerHTML = '';
    CODE.editor = m.editor.create(el, {
      theme: isDark() ? 'dash-dark' : 'dash-light', automaticLayout: true, fontSize: 13, lineHeight: 20,
      fontFamily: 'ui-monospace, "Cascadia Code", Consolas, monospace', fontLigatures: true, glyphMargin: true,
      minimap: { enabled: true, renderCharacters: false }, scrollBeyondLastLine: false, renderLineHighlight: 'all',
      smoothScrolling: true, cursorBlinking: 'smooth', tabSize: 2, bracketPairColorization: { enabled: true }, stickyScroll: { enabled: true },
    });
    CODE.decorations = CODE.editor.createDecorationsCollection();
    CODE.editor.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.KeyS, saveCode);
    CODE.editor.onDidChangeCursorPosition(renderIdeStatus);
    CODE.editor.onDidChangeModelContent(() => { renderIde(); });
  }
  if (CODE.context === key) await openFrame(CODE.frames[0]);
}

async function loadFile(file) {
  const known = [...CODE.files.values()].find(entry => sameFile(file, entry));
  if (known) return known;
  const src = await api('/api/source?path=' + encodeURIComponent(file));
  const m = window.monaco, uri = m.Uri.file(src.abs);
  const model = m.editor.getModel(uri) || m.editor.createModel(src.content, 'typescript', uri);
  const entry = { ...src, model, savedVersion: model.getAlternativeVersionId() };
  CODE.files.set(src.path, entry);
  return entry;
}
// Unsaved only if the text differs from what's on disk; the version check skips the text comparison when nothing changed.
const isDirty = entry => entry.model.getAlternativeVersionId() !== entry.savedVersion && entry.model.getValue() !== entry.content;

// Discard unsaved edits: restore the saved text and mark that as the saved state.
function revertCode() {
  const cur = CODE.current;
  cur.model.setValue(cur.content);
  cur.savedVersion = cur.model.getAlternativeVersionId();
  // setValue replaces the text, so put the failure and step markers back.
  decorate(cur);
  renderIde();
}

async function openFrame(frame) {
  if (!frame || !CODE.editor) return;
  const key = CODE.context;
  let entry;
  try { entry = await loadFile(frame.file); }
  catch (e) { notice('Could not open ' + baseName(frame.file) + ': ' + e.message); return; }
  if (key !== CODE.context) return;
  CODE.current = entry; CODE.frame = frame;
  if (CODE.editor.getModel() !== entry.model) CODE.editor.setModel(entry.model);
  decorate(entry);
  CODE.editor.revealLineInCenter(frame.line);
  CODE.editor.setPosition({ lineNumber: frame.line, column: frame.column || 1 });
  renderIde();
}

// Mark the failure, the call stack and every test.step() line in the open file.
function decorate(entry) {
  const m = window.monaco, decs = [];
  const line = n => new m.Range(n, 1, n, 1);
  for (const f of CODE.frames.filter(f => sameFile(f.file, entry))) {
    if (f.kind === 'error') decs.push({ range: line(f.line), options: { isWholeLine: true, className: 'ide-line-error', glyphMarginClassName: 'ide-glyph-error', glyphMarginHoverMessage: { value: '**Failed here**' }, overviewRuler: { color: '#f07373', position: m.editor.OverviewRulerLane.Full }, minimap: { color: '#f07373', position: m.editor.MinimapPosition.Inline } } });
    else if (f.kind === 'call') decs.push({ range: line(f.line), options: { isWholeLine: true, className: 'ide-line-call', glyphMarginClassName: 'ide-glyph-call', glyphMarginHoverMessage: { value: 'Called from here (on the way to the failure)' } } });
    else decs.push({ range: line(f.line), options: { glyphMarginClassName: 'ide-glyph-test', glyphMarginHoverMessage: { value: 'The test starts here' } } });
  }
  for (const st of CODE.steps.filter(st => st.location && sameFile(st.location.file, entry))) {
    const state = st.state === 'failed' ? 'failed' : st.state === 'running' ? 'running' : 'passed';
    // The step label is injected after the line's last character (Monaco skips injected text on empty ranges).
    const end = entry.model.getLineMaxColumn(Math.min(st.location.line, entry.model.getLineCount()));
    decs.push({ range: new m.Range(st.location.line, Math.max(1, end - 1), st.location.line, end), options: {
      glyphMarginClassName: 'ide-glyph-step-' + state, glyphMarginHoverMessage: { value: `Step **${st.title}** ${state}${st.duration != null ? ' in ' + fmtDur(st.duration) : ''}` },
      after: { content: `   ${state === 'passed' ? '✓' : state === 'failed' ? '✕' : '●'} ${st.title}${st.duration != null ? ' · ' + fmtDur(st.duration) : ''}`, inlineClassName: 'ide-after-' + state },
    } });
  }
  CODE.decorations.set(decs);
  // The error message sits under the failing line, like an inline IDE error.
  CODE.editor.changeViewZones(acc => {
    for (const id of CODE.zones) acc.removeZone(id);
    CODE.zones = [];
    const errFrame = CODE.frames.find(f => f.kind === 'error' && sameFile(f.file, entry));
    if (errFrame && CODE.error) {
      const lines = String(CODE.error.message || '').split('\n').filter(l => l.trim()).slice(0, 6);
      const node = document.createElement('div');
      node.className = 'ide-zone';
      node.textContent = lines.join('\n');
      CODE.zones.push(acc.addZone({ afterLineNumber: errFrame.line, heightInLines: lines.length + 0.4, domNode: node }));
    }
  });
}

function renderIde() {
  const host = CODE.host; if (!host) return;
  const files = [];
  for (const f of CODE.frames) if (!files.some(x => samePath(x.file, f.file))) files.push(f);
  host.querySelector('.ide-files').innerHTML = files.map(f => {
    const entry = [...CODE.files.values()].find(e => sameFile(f.file, e));
    const active = CODE.current && sameFile(f.file, CODE.current);
    return `<button class="ide-file ${active ? 'active' : ''}" data-file-tab="${esc(normPath(f.file))}" title="${esc(entry?.path || f.file)}"><span class="ts">TS</span>${esc(baseName(f.file))}${entry && isDirty(entry) ? '<span class="dirty" title="Unsaved changes"></span>' : ''}</button>`;
  }).join('');
  const label = { error: 'Failed here', call: 'Called from', test: 'Test starts' };
  host.querySelector('.ide-stack').innerHTML = CODE.frames.length
    ? '<span>Call stack</span>' + CODE.frames.map((f, i) => `<button class="ide-frame ${f.kind === 'error' ? 'error' : ''} ${CODE.frame === f ? 'current' : ''}" data-frame="${i}" title="${label[f.kind]}">${f.kind === 'error' ? '✕ ' : f.kind === 'call' ? '↳ ' : '▶ '}${esc(baseName(f.file))}:${f.line}</button>`).join('<span>›</span>')
    : '<span>No location recorded for this test.</span>';
  const cur = CODE.current, dirty = cur && isDirty(cur);
  host.querySelector('[data-ide=save]').disabled = !dirty;
  host.querySelector('[data-ide=revert]').disabled = !dirty;
  const vs = host.querySelector('[data-ide=vscode]');
  if (cur) vs.href = 'vscode://file/' + cur.abs.replace(/\\/g, '/') + ':' + (CODE.editor?.getPosition()?.lineNumber || CODE.frame?.line || 1);
  const note = host.querySelector('.ide-note');
  const changed = cur && cur.mtime > CODE.runStartedAt;
  note.hidden = !changed && !CODE.conflict;
  note.innerHTML = CODE.conflict
    ? `${esc(CODE.conflict)} <button class="btn small" data-ide="reload">Reload from disk</button>`
    : changed ? 'This file has changed since this run, so the highlighted lines may have moved.' : '';
  renderIdeStatus();
}

function renderIdeStatus() {
  const host = CODE.host, cur = CODE.current; if (!host) return;
  const pos = CODE.editor?.getPosition();
  host.querySelector('.ide-status').innerHTML = cur
    ? `<span>${esc(cur.path)}</span><span>${isDirty(cur) ? '● Unsaved changes' : 'Saved'}</span><span class="push">Ln ${pos?.lineNumber || 1}, Col ${pos?.column || 1}</span><span>Spaces: 2</span><span>UTF-8</span><span>TypeScript</span>`
    : '<span>Loading…</span>';
}

async function saveCode() {
  const cur = CODE.current; if (!cur || !isDirty(cur)) return;
  const version = cur.model.getAlternativeVersionId(), content = cur.model.getValue();
  try {
    const saved = await api('/api/source', { path: cur.path, content, hash: cur.hash });
    Object.assign(cur, { hash: saved.hash, mtime: saved.mtime, content, savedVersion: version });
    CODE.conflict = null;
    notice('Saved ' + cur.path + '.', true);
  } catch (e) { CODE.conflict = e.message; notice(e.message); }
  renderIde();
}

async function reloadCode() {
  const cur = CODE.current; if (!cur) return;
  const src = await api('/api/source?path=' + encodeURIComponent(cur.path));
  Object.assign(cur, { hash: src.hash, mtime: src.mtime, content: src.content });
  cur.model.setValue(src.content);
  cur.savedVersion = cur.model.getAlternativeVersionId();
  CODE.conflict = null;
  decorate(cur); renderIde();
}

// Warn before leaving the page with unsaved edits.
window.addEventListener('beforeunload', e => { if ([...CODE.files.values()].some(isDirty)) e.preventDefault(); });

// ---------- Live updates ----------
function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => $('#conn').innerHTML = '<span class="dot passed"></span>Connected';
  es.onerror = () => $('#conn').innerHTML = '<span class="dot failed"></span>Disconnected, retrying…';
  es.onmessage = ({ data }) => {
    const e = JSON.parse(data);
    if (e.type === 'runStart') {
      S.cache.set(e.run.id, e.run); S.liveId = e.run.id;
      loadRuns();
      location.hash = 'results=' + e.run.id;
      schedule();
    } else if (e.type === 'testChanged') {
      // A test was marked or unmarked as bugged.
      const r = S.cache.get(e.runId); if (r) r.tests[e.test.id] = e.test;
      loadRuns();
    } else if (e.type === 'bugs') {
      loadBugs();
    } else if (e.type === 'update') {
      const r = S.cache.get(e.runId); if (!r) return;
      if (e.test) r.tests[e.test.id] = e.test;
      r.errors = e.errors; r.status = e.status;
      schedule();
    } else if (e.type === 'log') {
      const r = S.cache.get(e.runId); if (!r) return;
      r.log = (r.log || '') + e.text;
      if (S.view === 'run' && S.runTab === 'console' && S.viewedId === e.runId) schedule();
    } else if (e.type === 'runEnd') {
      S.cache.set(e.run.id, e.run); S.liveId = null;
      loadRuns();
    }
  };
}
setInterval(() => {
  if (S.liveId) renderChrome();
  const el = document.getElementById('aiElapsed'); if (el) el.textContent = fmtDur(Date.now() - Number(el.dataset.since));
}, 1000);

(async () => {
  connect();
  // Show the requested view immediately; listing tests takes a few seconds while Playwright scans files.
  S.loading = true; route();
  const [{ current }] = await Promise.all([api('/api/state').catch(() => ({})), loadTests(), loadRuns(), loadBugs()]);
  if (current) { S.cache.set(current.id, current); S.liveId = current.id; }
  S.loading = false;
  await route();
})();
</script>
</body>
</html>
