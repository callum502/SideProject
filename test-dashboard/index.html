<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Dashboard</title>
<script>
  // Apply the saved theme before first paint. Dark is the default; "system" follows the OS.
  try { const t = JSON.parse(localStorage.getItem('pwdash.theme')); if (t === 'system') document.documentElement.removeAttribute('data-theme'); else if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --hover: #eef1f5; --border: #dfe3e8; --text: #1b1f24; --muted: #5f6b7a; --faint: #8a94a3;
    --accent: #2f6fde; --accent-text: #fff; --accent-soft: #e4edfc;
    --pass: #1f8a4c; --pass-bg: #e3f4ea; --fail: #c93a3a; --fail-bg: #fbe7e7;
    --warn: #a86a00; --warn-bg: #fdf1dc; --skip: #6b7684; --skip-bg: #eceff2; --run: #2f6fde; --run-bg: #e4edfc;
    --code-bg: #f6f7f9; --shadow: 0 1px 2px rgba(16,24,40,.06);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e1013; --panel: #15181d; --panel-2: #1b1f25; --hover: #20252c; --border: #272d35; --text: #e4e7eb; --muted: #949eab; --faint: #6b7480;
    --accent: #5b8def; --accent-text: #fff; --accent-soft: #1b2a45;
    --pass: #4cc283; --pass-bg: #13291e; --fail: #f07373; --fail-bg: #331a1b;
    --warn: #e0a844; --warn-bg: #33270f; --skip: #8a96a3; --skip-bg: #20252b; --run: #6aa1f5; --run-bg: #18263d;
    --code-bg: #0b0d10; --shadow: none;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #0e1013; --panel: #15181d; --panel-2: #1b1f25; --hover: #20252c; --border: #272d35; --text: #e4e7eb; --muted: #949eab; --faint: #6b7480;
      --accent: #5b8def; --accent-text: #fff; --accent-soft: #1b2a45;
      --pass: #4cc283; --pass-bg: #13291e; --fail: #f07373; --fail-bg: #331a1b;
      --warn: #e0a844; --warn-bg: #33270f; --skip: #8a96a3; --skip-bg: #20252b; --run: #6aa1f5; --run-bg: #18263d;
      --code-bg: #0b0d10; --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  code, pre, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
  a { color: var(--accent); }
  svg { flex: none; }

  /* ---------- Shell ---------- */
  .shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; background: var(--panel); border-right: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 16px; font-weight: 650; font-size: 15px; }
  .brand .logo { color: var(--accent); display: grid; place-items: center; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 550; }
  .nav-item:hover { background: var(--hover); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--text); }
  .nav-item .count { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .sidebar-foot { margin-top: auto; display: grid; gap: 4px; border-top: 1px solid var(--border); padding-top: 10px; }
  .sidebar-foot .nav-item { font-weight: 500; font-size: 13px; }
  .conn { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12px; color: var(--faint); }

  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .topbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 24px; }
  .topbar h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .topbar .sub { color: var(--muted); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
  .live-strip { display: flex; align-items: center; gap: 12px; padding: 0 24px 10px; font-size: 12.5px; color: var(--muted); }
  .live-strip .bar { flex: 1; }
  .view { padding: 20px 24px 48px; display: grid; gap: 16px; align-content: start; }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--border); }
    .brand { padding: 0 8px 0 0; }
    .sidebar-foot { margin: 0 0 0 auto; border: 0; padding: 0; display: flex; }
    .conn { display: none; }
    .topbar-row, .live-strip { padding-left: 16px; padding-right: 16px; }
    .view { padding: 16px 16px 40px; }
  }

  /* ---------- Controls ---------- */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--panel); padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--text); }
  .btn:hover:not(:disabled) { background: var(--hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
  .btn.danger { color: var(--fail); }
  .btn.small { padding: 3px 9px; font-size: 12.5px; }
  .field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .field input[type=number] { width: 54px; padding: 5px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  .field select { padding: 5px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  .field:has(input:disabled) { opacity: .6; }
  .sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 2px; }
  /* Checkboxes are drawn here rather than by the browser, so they look the same in every browser
     (native ones vary, and some browsers ignore accent-color). High-contrast mode keeps the native control. */
  input[type=checkbox] {
    appearance: none; -webkit-appearance: none; flex: none; margin: 0; width: 16px; height: 16px;
    display: inline-grid; place-content: center; vertical-align: middle; cursor: pointer;
    border: 1.5px solid var(--faint); border-radius: 4px; background: var(--panel);
    transition: background-color .12s, border-color .12s;
  }
  input[type=checkbox]::before {
    content: ''; width: 10px; height: 10px; background: var(--accent-text); transform: scale(0); transition: transform .12s;
    clip-path: polygon(12% 50%, 0 64%, 40% 100%, 100% 22%, 87% 9%, 40% 72%);
  }
  input[type=checkbox]:hover:not(:checked):not(:indeterminate) { border-color: var(--muted); }
  input[type=checkbox]:checked, input[type=checkbox]:indeterminate { background: var(--accent); border-color: var(--accent); }
  input[type=checkbox]:checked::before { transform: scale(1); }
  input[type=checkbox]:indeterminate::before { clip-path: none; width: 8px; height: 2px; border-radius: 1px; transform: scale(1); }
  input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=checkbox]:disabled { opacity: .5; cursor: default; }
  @media (forced-colors: active) { input[type=checkbox] { appearance: auto; -webkit-appearance: auto; } input[type=checkbox]::before { content: none; } }
  .search { flex: 1; min-width: 160px; max-width: 360px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .panel-head h2 { font-size: 13px; margin: 0; font-weight: 650; }
  .spacer { flex: 1; }
  .empty { padding: 28px 16px; color: var(--muted); text-align: center; }
  .banner { padding: 10px 14px; border-radius: 10px; background: var(--fail-bg); color: var(--fail); white-space: pre-wrap; }

  .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--panel-2); border-radius: 8px; }
  .seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .panel-head .seg { flex-wrap: wrap; }
  .seg button.active { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  :root[data-theme="dark"] .seg button.active { background: var(--hover); }
  /* Tab rows never scroll (the active tab's underline overlaps the border by 1px); on narrow panels they wrap. */
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--border); padding: 0 14px; overflow: visible; }
  .tabs button { border: 0; background: none; padding: 10px 10px 9px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .tabs .n { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }

  /* ---------- Status ---------- */
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--border); display: inline-block; }
  .dot.passed { background: var(--pass); } .dot.failed { background: var(--fail); }
  .dot.skipped, .dot.stopped { background: var(--skip); } .dot.running { background: var(--run); animation: pulse 1s infinite; }
  .dot.queued { background: transparent; border: 1.5px solid var(--skip); }
  @keyframes pulse { 50% { opacity: .3; } }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--skip-bg); color: var(--skip); white-space: nowrap; }
  .pill.passed { background: var(--pass-bg); color: var(--pass); } .pill.failed { background: var(--fail-bg); color: var(--fail); }
  .pill.running { background: var(--run-bg); color: var(--run); }
  .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--panel-2); min-width: 60px; }
  .bar span { display: block; transition: width .3s; }
  .bar .passed { background: var(--pass); } .bar .failed { background: var(--fail); } .bar .skipped, .bar .stopped { background: var(--skip); } .bar .running { background: var(--run); opacity: .6; }

  /* ---------- Tests view ---------- */
  .rows { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--faint); padding: 8px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--hover); }
  tr.file-row td { background: var(--panel-2); font-weight: 600; font-size: 12.5px; color: var(--muted); padding-top: 6px; padding-bottom: 6px; }
  tr.file-row:hover td { background: var(--hover); }
  td.check, th.check { width: 36px; padding-right: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .last { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; text-decoration: none; }
  a.last:hover { color: var(--text); text-decoration: underline; }
  .loc { color: var(--faint); font-size: 12px; }

  /* ---------- Run view ---------- */
  .run-head { padding: 14px 16px; display: grid; gap: 12px; }
  .run-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .run-title .when { font-weight: 650; font-size: 15px; }
  .run-title .cmd { color: var(--faint); }
  .run-title .live-now { color: var(--run); font-weight: 550; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat.passed .value { color: var(--pass); } .stat.failed .value { color: var(--fail); }

  .split { display: grid; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
  .list { padding: 6px; display: grid; gap: 2px; }
  .item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
  .item:hover { background: var(--hover); }
  .item.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .item .name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .dur { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .item .meta { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .item .meta .loc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ticks { display: inline-flex; gap: 2px; margin-left: auto; }
  .ticks i { width: 14px; height: 4px; border-radius: 2px; background: var(--skip-bg); }
  .ticks i.passed { background: var(--pass); } .ticks i.failed { background: var(--fail); } .ticks i.running { background: var(--run); }

  .detail { position: sticky; top: 112px; max-height: calc(100vh - 128px); display: flex; flex-direction: column; }
  @media (max-width: 1100px) { .detail { position: static; max-height: none; } }
  .detail-head { padding: 14px 16px 10px; display: grid; gap: 6px; }
  .detail-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .seg.attempts { justify-self: start; }
  .attempt-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; }
  /* A button at the end of a tab row (e.g. "Delete attempt 3 data"), styled as a small danger button. */
  .tabs button.tab-action { flex: none; margin: 4px 0 4px auto; padding: 5px 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; line-height: 1.3; font-size: 13px; border: 1px solid color-mix(in srgb, var(--fail) 45%, var(--border)); border-radius: 8px; color: var(--fail); background: var(--panel); }
  .tabs button.tab-action:hover { background: var(--fail-bg); color: var(--fail); }
  /* Disabled buttons get no mouse events, so their tooltip lives on a wrapper. */
  .tip { display: inline-flex; }
  .tip > button:disabled { pointer-events: none; }

  /* ---------- Video action list ---------- */
  .acts { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .acts-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel-2); border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
  .acts-head b { color: var(--text); font-weight: 600; }
  .acts-list { max-height: 340px; overflow-y: auto; scroll-behavior: smooth; }
  /* Video tab: on a wide panel the action list sits beside the video at the same height, so both are visible
     together; on a narrow panel it stacks under a smaller video. */
  .detail-body.video-tab { container-type: inline-size; }
  .video-layout { display: grid; gap: 12px; align-items: stretch; }
  .video-layout .video { max-height: 38vh; }
  .video-layout .acts-list { max-height: 300px; }
  @container (min-width: 700px) {
    .video-layout { grid-template-columns: minmax(0, 1.55fr) minmax(270px, 1fr); }
    .video-layout .video { max-height: min(60vh, 560px); }
    /* contain: size lets the video alone set the row height; the list then fills it and scrolls. */
    .video-layout .acts { contain: size; display: flex; flex-direction: column; min-height: 220px; }
    .video-layout .acts-list { flex: 1 1 auto; min-height: 0; max-height: none; }
  }
  .act-section { padding: 7px 12px 5px; font-size: 11.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .act-section:first-child { border-top: 0; }
  .act { display: grid; grid-template-columns: 58px 22px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; width: 100%; padding: 6px 12px; border: 0; border-left: 3px solid transparent; background: none; color: var(--text); text-align: left; cursor: pointer; transition: background-color .15s, border-color .15s; }
  .act:hover { background: var(--hover); }
  .act.current { background: var(--accent-soft); border-left-color: var(--accent); }
  .act-time { font: 12px ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--accent); font-variant-numeric: tabular-nums; }
  .act-icon { color: var(--muted); display: grid; place-items: center; }
  .act-title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act-dur { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .act-code { grid-column: 3 / 5; font: 11.5px ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act.failed .act-title, .act.failed .act-icon { color: var(--fail); }
  .act.failed { border-left-color: color-mix(in srgb, var(--fail) 60%, transparent); }

  /* ---------- Code tab (IDE) ---------- */
  .ide { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--code-bg); display: flex; flex-direction: column; min-width: 0; }
  .ide-bar { display: flex; align-items: stretch; background: var(--panel-2); border-bottom: 1px solid var(--border); min-height: 36px; }
  .ide-files { display: flex; overflow-x: auto; min-width: 0; }
  .ide-file { display: inline-flex; align-items: center; gap: 7px; padding: 0 14px; border: 0; border-right: 1px solid var(--border); border-top: 2px solid transparent; background: none; color: var(--muted); font: 12.5px ui-monospace, "Cascadia Code", Consolas, monospace; cursor: pointer; white-space: nowrap; }
  .ide-file:hover { color: var(--text); }
  .ide-file.active { background: var(--code-bg); color: var(--text); border-top-color: var(--accent); }
  .ide-file .dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--text); opacity: .8; }
  .ide-file .ts { color: #3178c6; font-weight: 700; font-size: 10px; letter-spacing: .02em; }
  .ide-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; padding: 0 8px; }
  .ide-stack { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
  .ide-frame { font: 12px ui-monospace, "Cascadia Code", Consolas, monospace; border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; background: none; color: var(--text); cursor: pointer; }
  .ide-frame:hover { background: var(--hover); }
  .ide-frame.error { border-color: color-mix(in srgb, var(--fail) 50%, var(--border)); color: var(--fail); }
  .ide-frame.current { box-shadow: inset 0 0 0 1px var(--accent); }
  .ide-note { padding: 7px 12px; font-size: 12.5px; background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ide-editor { height: min(62vh, 640px); min-height: 260px; }
  .ide-editor .ide-loading { padding: 20px; color: var(--muted); }
  .ide-status { display: flex; gap: 16px; flex-wrap: wrap; padding: 3px 12px; font-size: 11.5px; background: var(--accent); color: var(--accent-text); }
  .ide-status .push { margin-left: auto; }
  /* Editor decorations (rendered inside Monaco). */
  .ide-line-error { background: rgba(240, 115, 115, .16); }
  .ide-line-call { background: rgba(91, 141, 239, .10); }
  .ide-glyph-error::before, .ide-glyph-call::before, .ide-glyph-test::before, .ide-glyph-step-passed::before, .ide-glyph-step-failed::before, .ide-glyph-step-running::before { display: block; text-align: center; font-weight: 700; font-size: 12px; }
  .ide-glyph-error::before { content: '✕'; color: #f07373; }
  .ide-glyph-call::before { content: '↳'; color: #6aa1f5; }
  .ide-glyph-test::before { content: '▶'; color: #8a96a3; font-size: 10px; }
  .ide-glyph-step-passed::before { content: '✓'; color: #4cc283; }
  .ide-glyph-step-failed::before { content: '✕'; color: #f07373; }
  .ide-glyph-step-running::before { content: '●'; color: #6aa1f5; }
  .ide-after-passed { color: #4cc283 !important; font-style: italic; opacity: .85; }
  .ide-after-failed { color: #f07373 !important; font-style: italic; }
  .ide-after-running { color: #6aa1f5 !important; font-style: italic; }
  .ide-zone { box-sizing: border-box; padding: 4px 12px; border-left: 3px solid #f07373; background: rgba(240, 115, 115, .10); color: #f07373; font: 12px/18px ui-monospace, "Cascadia Code", Consolas, monospace; white-space: pre; overflow: hidden; }
  .seg.attempts .dot { width: 7px; height: 7px; }
  .detail-head .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; color: var(--muted); font-size: 12.5px; }
  .detail-body { padding: 16px; overflow: auto; display: grid; gap: 14px; align-content: start; }
  .section-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  pre { margin: 0; padding: 10px 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; overflow: auto; max-height: 420px; white-space: pre-wrap; word-break: break-word; }
  pre.error { border-left: 3px solid var(--fail); }
  pre.snippet { white-space: pre; word-break: normal; }
  /* Long unwrapped lines (code snippets) scroll inside their box instead of widening the panel. */
  .detail-body > *, .detail-body pre { min-width: 0; max-width: 100%; }
  .steps { display: grid; gap: 0; }
  .step { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .step:last-child { border-bottom: 0; }
  .step .ic { margin-top: 5px; }
  .step .t { font-weight: 550; }
  .step .d { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .step .msg { grid-column: 2 / 4; color: var(--fail); font-size: 12.5px; white-space: pre-wrap; }
  .callout { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 8px; background: var(--fail-bg); color: var(--fail); font-weight: 550; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .shot { display: block; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
  .shot img { display: block; width: 100%; }
  .video { display: block; width: 100%; max-height: 62vh; border-radius: 8px; border: 1px solid var(--border); background: #000; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .ai { border: 1px dashed var(--border); border-radius: 10px; padding: 14px 16px; background: var(--panel-2); display: grid; gap: 14px; }
  .ai-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .ai .badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--border); color: var(--muted); }
  .ai p { margin: 0; color: var(--muted); }
  .ai .ai-summary { color: var(--text); font-size: 14.5px; }
  .ai-section { display: grid; gap: 6px; }
  .ai-section ul { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 3px; }
  .ai-diff { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .ai-diff-file { padding: 5px 10px; font-size: 12px; background: var(--panel); border-bottom: 1px solid var(--border); color: var(--muted); }
  .ai-diff pre { border: 0; border-radius: 0; margin: 0; white-space: pre; overflow-x: auto; }
  .ai-diff .del { color: var(--fail); background: var(--fail-bg); display: inline-block; min-width: 100%; }
  .ai-diff .add { color: var(--pass); background: var(--pass-bg); display: inline-block; min-width: 100%; }
  .ai-draft { white-space: pre-wrap; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .console pre { border: 0; border-radius: 0 0 12px 12px; max-height: calc(100vh - 290px); min-height: 200px; }
  .warn { font-size: 12.5px; color: var(--warn); }

  /* ---------- Triage ---------- */
  .dot.investigate { background: var(--warn); } .dot.bugged { background: var(--fail); }
  .pill.investigate { background: var(--warn-bg); color: var(--warn); } .pill.bugged { background: var(--fail-bg); color: var(--fail); }
  .bar .investigate { background: var(--warn); } .bar .bugged { background: var(--fail); }
  .stat.running .value { color: var(--run); } .stat.investigate .value { color: var(--warn); } .stat.bugged .value { color: var(--fail); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
  .buglink { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 10px; border-radius: 8px; background: var(--fail-bg); color: var(--fail); text-decoration: none; font-weight: 550; }
  .actions .buglink { max-width: min(480px, 100%); }
  .banner.ok { background: var(--pass-bg); color: var(--pass); }
  .buglink:hover { text-decoration: underline; }
  dialog.modal { width: min(640px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  dialog.modal::backdrop { background: rgba(0,0,0,.5); }
  dialog.modal form { display: grid; gap: 14px; padding: 18px 20px 20px; }
  .modal-head { display: flex; align-items: center; gap: 10px; }
  .modal-head h2 { margin: 0; font-size: 16px; flex: 1; }
  dialog.modal label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 550; }
  dialog.modal input:not([type=checkbox]), dialog.modal textarea, dialog.modal select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); font: inherit; color: var(--text); }
  dialog.modal textarea { resize: vertical; min-height: 110px; }
  .evidence { font-size: 12.5px; color: var(--muted); background: var(--panel-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
  .evidence b { color: var(--text); font-weight: 600; }
  .att-list { display: grid; gap: 4px; margin-top: 6px; }
  dialog.modal label.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 400; cursor: pointer; }
  dialog.modal .hint { padding: 8px 12px; border-radius: 8px; background: var(--panel-2); font-size: 13px; line-height: 1.6; }
  dialog.modal .hint .buglink, .ai-match .buglink { padding: 1px 8px; vertical-align: baseline; max-width: 100%; }
  dialog.modal label.att-pick { display: grid; grid-template-columns: auto auto auto 1fr auto; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); font-weight: 400; cursor: pointer; }
  dialog.modal label.att-pick:has(input:checked) { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); background: var(--accent-soft); }
  .att-pick .att-has { color: var(--muted); font-size: 12px; justify-self: end; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .bug-head { padding: 16px; display: grid; gap: 10px; }
  .bug-head h2 { margin: 0; font-size: 18px; }
  .bug-head .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .bug-desc { padding: 0 16px 16px; white-space: pre-wrap; line-height: 1.55; }
  .occ { padding: 14px 16px; border-top: 1px solid var(--border); display: grid; gap: 10px; }
  .bug-attempt { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); min-width: 0; }
  .bug-attempt-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .occ .media { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .occ .media img, .occ .media video { width: 100%; border-radius: 8px; border: 1px solid var(--border); background: #000; display: block; }
  .pill.open { background: var(--fail-bg); color: var(--fail); } .pill.closed { background: var(--skip-bg); color: var(--skip); }

  /* ---------- History view ---------- */
  .hist-bar { width: 120px; }
  tr.live td:first-child { box-shadow: inset 3px 0 var(--run); }
</style>
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Dashboard">
    <div class="brand"><span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2v17.5a2.5 2.5 0 0 1-5 0V2"/><path d="M8.5 2h7"/><path d="M9.5 14h5"/></svg></span>Test Dashboard</div>
    <a class="nav-item" href="#tests" data-nav="tests">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>
      Tests <span class="count" id="navTests"></span></a>
    <a class="nav-item" href="#results" data-nav="results">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Results <span class="count" id="navResults"></span></a>
    <a class="nav-item" href="#bugs" data-nav="bugs">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8" y="6" width="8" height="14" rx="4"/><path d="M12 10v10M8 13H4M20 13h-4M8 17H5M19 17h-3M9 6 7 3M15 6l2-3M8 9H5M19 9h-3"/></svg>
      Bugs <span class="count" id="navBugs"></span></a>
    <div class="sidebar-foot">
      <button class="nav-item btn-reset" id="theme" style="border:0;background:none;cursor:pointer;width:100%;text-align:left"></button>
      <div class="conn" id="conn"><span class="dot queued"></span>Connecting…</div>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="topbar-row">
        <a class="btn small" id="back" href="#results" hidden title="Back to all results (Esc)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>All results</a>
        <div><h1 id="viewTitle">Tests</h1><div class="sub" id="viewSub"></div></div>
        <div class="controls" id="controls">
          <label class="field" title="Number of Playwright workers (--workers)">Workers <input id="workers" type="number" min="1" max="16" value="1"></label>
          <label class="field" title="Pause before every browser action so the run is easier to follow in its video. The test timeout is raised to match.">Slow-mo
            <select id="slowMo">
              <option value="0">Off</option>
              <option value="250">250 ms</option>
              <option value="500">500 ms</option>
              <option value="1000">1 s</option>
              <option value="2000">2 s</option>
            </select></label>
          <label class="field" title="How many times each test is tried automatically in this run. With 2 or 3, a failed test is tried again straight away; it counts as passed if any attempt passes, and every attempt keeps its own logs and video.">Auto attempts
            <select id="autoAttempts">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select></label>
          <span class="sep"></span>
          <button id="runSelected" class="btn primary"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg><span>Run selected</span></button>
        </div>
      </div>
      <div class="live-strip" id="liveStrip" hidden>
        <span class="pill running"><span class="dot running"></span>Running</span>
        <span id="liveText"></span>
        <div class="bar" id="liveBar"></div>
        <a href="#results" id="liveLink">View</a>
        <button id="stop" class="btn small danger"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>Stop</button>
      </div>
    </header>
    <div id="notice" class="banner" hidden style="margin: 16px 24px 0"></div>
    <main class="view" id="view"></main>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const api = async (url, body) => {
  const res = await fetch(url, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('pwdash.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pwdash.' + k, JSON.stringify(v)); } catch {} },
};
const fmtDur = ms => ms == null ? '' : ms < 1000 ? `${ms} ms` : ms < 60000 ? `${(ms / 1000).toFixed(1)} s` : `${Math.floor(ms / 60000)}m ${Math.round(ms % 60000 / 1000)}s`;
const fmtTime = t => new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const fmtAgo = t => { const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : fmtTime(t); };
const LABEL = { passed: 'Passed', failed: 'Failed', investigate: 'Triage needed', bugged: 'Bugged', skipped: 'Skipped', running: 'Running', queued: 'Queued', stopped: 'Stopped' };
const ORDER = { investigate: 0, bugged: 1, running: 2, queued: 3, passed: 4, skipped: 5, stopped: 6 };
// Run filter tabs: every test state belongs to exactly one tab, so a test can always be found.
const FILTER_GROUPS = { running: ['running', 'queued'], investigate: ['investigate'], bugged: ['bugged'], passed: ['passed'], skipped: ['skipped', 'stopped'] };
const isFail = t => t.state === 'failed';
// Triage of a test: a failure needs triage until it passes on a retry or is linked to a bug report.
const triage = t => t.state === 'failed' ? (t.bug ? 'bugged' : 'investigate') : t.state;
// A finished run is labelled by what still needs doing: triage first, then bugs.
const runState = (status, c) => ['running', 'stopped'].includes(status) ? status : c.investigate ? 'investigate' : c.bugged ? 'bugged' : status === 'failed' ? 'failed' : 'passed';
const bugLabel = n => 'BUG-' + String(n).padStart(3, '0');
// Attempts a test made in a run: 1, plus one per retry.
const attemptCount = t => t.attempts?.length || (['queued', 'stopped'].includes(t.state) ? 0 : 1);
// Each test stores at most this many attempts per run (matches the server); Retry is blocked until one is deleted.
const MAX_ATTEMPTS = 5;
const canRetry = t => attemptCount(t) < MAX_ATTEMPTS;

const S = {
  tests: [], selected: new Set(store.get('selected', [])), firstVisit: store.get('selected', null) === null,
  runs: [], cache: new Map(), viewedId: null, liveId: null,
  view: 'tests', resultFilter: 'all', runTab: 'results', picked: null, detailTab: null, filter: '',
  bugs: [], bugCache: new Map(), bugId: null,
};
const viewed = () => S.cache.get(S.viewedId) || null;
const live = () => S.cache.get(S.liveId) || null;

// ---------- Theme ----------
const THEMES = ['dark', 'light', 'system'];
const isDark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(t) {
  setTimeout(() => window.monaco?.editor.setTheme(isDark() ? 'dash-dark' : 'dash-light'));
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
  const icon = { dark: '<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>', light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', system: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>' }[t];
  $('#theme').innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${icon}</svg>Theme: ${t[0].toUpperCase() + t.slice(1)}`;
}
let theme = store.get('theme', 'dark');
applyTheme(theme);
$('#theme').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; store.set('theme', theme); applyTheme(theme); });

// ---------- Run controls ----------
$('#workers').value = store.get('workers', 1);
$('#workers').addEventListener('input', () => store.set('workers', Number($('#workers').value)));
// Slow-mo defaults to 500 ms. (New storage key, so earlier saved "Off" values don't carry over.)
$('#slowMo').value = String(store.get('slowMoMs', 500));
if (!$('#slowMo').value) $('#slowMo').value = '500';
$('#slowMo').addEventListener('change', () => store.set('slowMoMs', Number($('#slowMo').value)));
// Auto attempts = total tries per test (1–3); Playwright's retries is one less. Carries over an earlier Retries choice.
$('#autoAttempts').value = String(store.get('autoAttempts', Math.min(3, store.get('retries', 0) + 1)));
if (!$('#autoAttempts').value) $('#autoAttempts').value = '1';
$('#autoAttempts').addEventListener('change', () => store.set('autoAttempts', Number($('#autoAttempts').value)));

// Latest recorded result for a test: the live run first, then the most recent run that included it.
function lastResult(id) {
  const l = live()?.tests?.[id];
  if (l && l.state !== 'queued') return l;
  for (const r of S.runs) { const t = r.results?.[id]; if (t && t.state !== 'queued' && t.state !== 'stopped') return { ...t, runId: r.id }; }
  return null;
}
async function run(ids) {
  try { await api('/api/run', { ids, workers: Number($('#workers').value) || 1, headed: false, slowMo: Number($('#slowMo').value) || 0, retries: (Number($('#autoAttempts').value) || 1) - 1 }); }
  catch (e) { notice(e.message); }
}
let noticeTimer;
// Errors show red; pass ok=true for confirmations.
function notice(msg, ok = false) { $('#notice').textContent = msg; $('#notice').classList.toggle('ok', ok); $('#notice').hidden = false; clearTimeout(noticeTimer); noticeTimer = setTimeout(() => $('#notice').hidden = true, 7000); }
$('#runSelected').addEventListener('click', () => run([...S.selected]));
// Stop lives in the top strip and, for the run you're viewing, in its summary.
document.addEventListener('click', e => { if (e.target.closest('#stop, [data-stop]')) api('/api/stop', {}).catch(err => notice(err.message)); });

// What the run in progress is doing right now, e.g. "3/6 done · 1 failed · 42.1 s" or "Retrying 1 test · 6.6 s".
// In the run summary (inSummary), the elapsed time is left out because the Duration stat shows it,
// except for a retry, whose own time differs from the run's.
function liveStatus(l, inSummary = false) {
  const c = counts(l), total = Object.keys(l.tests).length, done = total - c.running - c.queued;
  // A retry inside an existing run is timed from when the retry started.
  const time = fmtDur(Date.now() - (l.retrying ? l.retryStartedAt : l.startedAt));
  const since = inSummary && !l.retrying ? '' : time;
  const retryTest = l.retrying && l.tests[l.retrying[0]];
  if (l.keepOpen) return retryTest?.state === 'queued' ? `Headed retry: starting the browser… ${since}` : `Headed retry of “${retryTest?.title || 'test'}” · ${since} · when it ends the browser stays open. Press Resume in Playwright Inspector, or close the browser, to finish.`;
  if (l.retrying) return `Retrying ${l.retrying.length} test${l.retrying.length > 1 ? 's' : ''} · ${since}`;
  if (!done && !c.running) return `Starting Playwright and the app server…${since ? ' ' + since : ''}`;
  return [`${done}/${total} done`, c.investigate + c.bugged ? `${c.investigate + c.bugged} failed` : '', since].filter(Boolean).join(' · ');
}

function counts(r) {
  const c = { passed: 0, investigate: 0, bugged: 0, skipped: 0, running: 0, queued: 0, stopped: 0 };
  for (const t of Object.values(r.tests)) c[triage(t)] = (c[triage(t)] || 0) + 1;
  return c;
}
const barHtml = (c, total) => ['passed', 'investigate', 'bugged', 'skipped', 'stopped', 'running'].map(s => c[s] ? `<span class="${s}" style="width:${c[s] / (total || 1) * 100}%"></span>` : '').join('');

function renderChrome() {
  const busy = !!S.liveId;
  $('#runSelected').disabled = busy || !S.selected.size;
  $('#runSelected span').textContent = S.selected.size && S.selected.size !== S.tests.length ? `Run ${S.selected.size} selected` : 'Run selected';
  // Run controls belong to the Tests view; the live strip (with Stop) shows on every view.
  $('#controls').hidden = S.view !== 'tests';
  $('#back').hidden = !['run', 'bug'].includes(S.view);
  $('#back').href = S.view === 'bug' ? '#bugs' : '#results';
  $('#back').lastChild.textContent = S.view === 'bug' ? 'All bugs' : 'All results';
  const l = live();
  // On the live run's own page its status and Stop sit in the run summary, so the top strip is only shown elsewhere.
  const onLiveRun = l && S.view === 'run' && S.viewedId === S.liveId;
  $('#liveStrip').hidden = !l || onLiveRun;
  if (l) {
    const c = counts(l), total = Object.keys(l.tests).length;
    $('#liveText').textContent = liveStatus(l);
    $('#liveBar').innerHTML = barHtml(c, total);
    $('#liveLink').href = '#results=' + l.id;
  }
  // Keep the run summary's live status and Duration ticking (it's only re-rendered when results change).
  if (onLiveRun && $('#runLiveText')) {
    $('#runLiveText').textContent = liveStatus(l, true);
    $('#runElapsed').textContent = fmtDur(Date.now() - l.startedAt);
  }
  // Sidebar: Results stays highlighted while viewing a single run.
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === ({ run: 'results', bug: 'bugs' }[S.view] || S.view)));
  const openBugs = S.bugs.filter(b => b.status === 'open').length;
  $('#navBugs').textContent = openBugs || '';
  $('#navTests').textContent = S.tests.length || '';
  $('#navResults').innerHTML = S.liveId ? '<span class="dot running"></span>' : S.runs.length || '';
  // Title.
  const r = viewed();
  const titles = { tests: ['Tests', S.loading && !S.tests.length ? 'Loading…' : `${S.selected.size} of ${S.tests.length} selected`], run: ['Results', r ? fmtTime(r.startedAt) : 'Run not found'], results: ['Results', S.loading && !S.runs.length ? 'Loading…' : `${S.runs.length} recent runs`],
    bugs: ['Bugs', `${openBugs} open · ${S.bugs.length - openBugs} closed`], bug: ['Bugs', S.bugCache.get(S.bugId) ? bugLabel(S.bugCache.get(S.bugId).number) : 'Report not found'] };
  $('#viewTitle').textContent = titles[S.view][0];
  $('#viewSub').textContent = titles[S.view][1];
}

// ---------- Routing ----------
async function route() {
  const hash = location.hash.slice(1);
  // #tests, #results (all runs), #results=<id> (one run), #bugs or #bugs=<id> (one report).
  const [name, id] = hash.split('=');
  S.view = name === 'results' ? (id ? 'run' : 'results') : name === 'bugs' ? (id ? 'bug' : 'bugs') : 'tests';
  if (S.view === 'run' && id !== S.viewedId) await openRun(id);
  if (S.view === 'bug') { S.bugId = id; await loadBug(id); }
  mount();
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.target.closest('input, textarea, select, dialog')) return;
  if (S.view === 'run') location.hash = 'results';
  if (S.view === 'bug') location.hash = 'bugs';
});
async function openRun(id) {
  if (!S.cache.has(id) || (id !== S.liveId && !S.cache.get(id).endedAt)) {
    try { S.cache.set(id, await api('/api/runs/' + id)); } catch { S.viewedId = null; return; }
  }
  if (S.viewedId !== id) { S.picked = null; S.userPicked = false; S.detailTab = null; }
  S.viewedId = id;
}
window.addEventListener('hashchange', route);

// ---------- Views ----------
function mount() {
  const v = $('#view');
  if (S.view === 'tests') v.innerHTML = `
    <div id="listError" class="banner" hidden></div>
    <section class="panel">
      <div class="panel-head">
        <input id="filter" class="search" type="search" placeholder="Filter tests…" value="${esc(S.filter)}">
        <span class="spacer"></span>
        <button id="selNone" class="btn small">Clear</button>
        <button id="refresh" class="btn small" title="Re-scan test files">Refresh</button>
      </div>
      <div class="rows" id="testRows"></div>
    </section>`;
  else if (S.view === 'run') v.innerHTML = `<section class="panel" id="runHead"></section><div id="runBody"></div>`;
  else if (S.view === 'bugs') v.innerHTML = `<section class="panel"><div class="rows" id="bugRows"></div></section>`;
  else if (S.view === 'bug') v.innerHTML = `<div id="bugBody" style="display:grid;gap:16px"></div>`;
  else v.innerHTML = `<section class="panel"><div class="rows" id="resRows"></div></section>`;
  bindView();
  update();
}

function update() {
  renderChrome();
  if (S.view === 'tests') renderTests();
  else if (S.view === 'run') renderRun();
  else if (S.view === 'bugs') renderBugsList();
  else if (S.view === 'bug') renderBug();
  else renderResultsList();
}

let renderQueued = false;
const schedule = () => { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; update(); }); };

function bindView() {
  if (S.view === 'tests') {
    $('#filter').addEventListener('input', e => { S.filter = e.target.value; renderTests(); });
    $('#refresh').addEventListener('click', () => loadTests(true));
    $('#selNone').addEventListener('click', () => { S.selected.clear(); saveSel(); update(); });
    $('#testRows').addEventListener('click', e => {
      if (e.target.closest('a')) return;
      const row = e.target.closest('tr[data-id], tr[data-file], th.check');
      if (!row) return;
      if (row.matches('th.check')) { const all = S.tests.every(t => S.selected.has(t.id)); S.selected = new Set(all ? [] : S.tests.map(t => t.id)); }
      else if (row.dataset.id) S.selected.has(row.dataset.id) ? S.selected.delete(row.dataset.id) : S.selected.add(row.dataset.id);
      else { const list = S.tests.filter(t => t.file === row.dataset.file); const on = list.every(t => S.selected.has(t.id)); list.forEach(t => on ? S.selected.delete(t.id) : S.selected.add(t.id)); }
      saveSel(); update();
    });
  }
  if (S.view === 'run') {
    $('#runBody').addEventListener('click', e => {
      const b = e.target.closest('[data-rtab]'); if (b) { S.runTab = b.dataset.rtab; renderRun(); return; }
      const f = e.target.closest('[data-filter]'); if (f) { S.resultFilter = f.dataset.filter; renderRun(); return; }
      const it = e.target.closest('[data-pick]'); if (it) { S.picked = it.dataset.pick; S.userPicked = true; S.detailTab = null; renderRun(); return; }
      const d = e.target.closest('[data-dtab]'); if (d) { S.detailTab = d.dataset.dtab; renderRun(); return; }
      const at = e.target.closest('[data-attempt]'); if (at) { S.attemptFor = S.picked; S.attempt = Number(at.dataset.attempt); S.detailTab = null; renderRun(); return; }
      const tr = e.target.closest('[data-trace]'); if (tr) api('/api/trace', { runId: S.viewedId, file: tr.dataset.trace }).catch(err => notice(err.message));
      if (e.target.closest('[data-retry]')) retry([S.picked]);
      if (e.target.closest('[data-retry-headed]')) retry([S.picked], { headed: true });
      if (e.target.closest('[data-retry-all]')) retry(Object.values(viewed().tests).filter(t => triage(t) === 'investigate' && canRetry(t)).map(t => t.id));
      const ai = e.target.closest('[data-ai]'); if (ai) { aiAction(ai.dataset.ai); return; }
      const seek = e.target.closest('[data-seek]');
      if (seek) { const v = seek.closest('.detail')?.querySelector('video'); if (v) smoothSeek(v, Number(seek.dataset.seek) / 1000); return; }
      const del = e.target.closest('[data-del-attempt]');
      if (del) {
        // Two clicks: the first turns the button into a confirmation for 4 seconds.
        const key = S.picked + ':' + del.dataset.delAttempt, n = Number(del.dataset.delAttempt) + 1;
        clearTimeout(S.confirmTimer);
        if (S.confirmDelete !== key) { S.confirmDelete = key; S.confirmTimer = setTimeout(() => { S.confirmDelete = null; renderRun(); }, 4000); renderRun(); return; }
        S.confirmDelete = null;
        api(`/api/runs/${S.viewedId}/delete-attempt`, { testId: S.picked, retry: Number(del.dataset.delAttempt) })
          .then(() => { S.attemptFor = null; notice(`Deleted attempt ${n} data.`, true); }).catch(err => notice(err.message));
        return;
      }
      if (e.target.closest('[data-bug]')) openBugDialog(viewed().tests[S.picked]);
      if (e.target.closest('[data-unbug]')) api(`/api/runs/${S.viewedId}/unbug`, { testId: S.picked }).then(() => notice('Unmarked: the test needs triage again.', true)).catch(err => notice(err.message));
      if (e.target.closest('[data-open-external]')) api('/api/open-in-browser', { hash: 'results=' + S.viewedId }).then(() => notice('Opened this run in your default browser.')).catch(err => notice(err.message));
    });
    $('#runBody').addEventListener('keydown', e => {
      if (!['ArrowDown', 'ArrowUp'].includes(e.key) || !e.target.closest('.list')) return;
      e.preventDefault();
      const ids = shownResults().map(t => t.id), i = ids.indexOf(S.picked);
      S.picked = ids[Math.max(0, Math.min(ids.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; S.userPicked = true; S.detailTab = null;
      renderRun(); $(`[data-pick="${CSS.escape(S.picked)}"]`)?.focus();
    });
  }
  if (S.view === 'results') $('#resRows').addEventListener('click', e => { const tr = e.target.closest('tr[data-run]'); if (tr) location.hash = 'results=' + tr.dataset.run; });
  if (S.view === 'bugs') $('#bugRows').addEventListener('click', e => { const tr = e.target.closest('tr[data-bug-id]'); if (tr) location.hash = 'bugs=' + tr.dataset.bugId; });
  if (S.view === 'bug') $('#bugBody').addEventListener('click', e => {
    const tr = e.target.closest('[data-bug-trace]');
    if (tr) api('/api/trace', { bugId: S.bugId, file: tr.dataset.bugTrace }).catch(err => notice(err.message));
    const st = e.target.closest('[data-bug-status]');
    if (st) api(`/api/bugs/${S.bugId}/status`, { status: st.dataset.bugStatus }).then(bug => { S.bugCache.set(bug.id, bug); loadBugs(); }).catch(err => notice(err.message));
  });
}
const saveSel = () => store.set('selected', [...S.selected]);

// ---------- Tests ----------
async function loadTests(refresh) {
  try {
    const data = refresh ? await api('/api/tests/refresh', {}) : await api('/api/tests');
    S.tests = data.tests;
    const ids = new Set(S.tests.map(t => t.id));
    S.selected = new Set([...S.selected].filter(id => ids.has(id)));
    if (S.firstVisit) { S.tests.forEach(t => S.selected.add(t.id)); S.firstVisit = false; }
    saveSel();
    if ($('#listError')) $('#listError').hidden = true;
  } catch (e) {
    S.tests = [];
    if ($('#listError')) { $('#listError').textContent = 'Could not list tests:\n' + e.message; $('#listError').hidden = false; }
    else notice('Could not list tests: ' + e.message);
  }
  update();
}

function renderTests() {
  const el = $('#testRows'); if (!el) return;
  const q = S.filter.trim().toLowerCase();
  const visible = S.tests.filter(t => !q || (t.file + ' ' + t.titlePath.join(' ')).toLowerCase().includes(q));
  if (!visible.length) { el.innerHTML = `<div class="empty">${S.tests.length ? 'No tests match the filter.' : S.loading ? 'Loading tests…' : 'No tests found.'}</div>`; return; }
  const byFile = new Map();
  for (const t of visible) (byFile.get(t.file) || byFile.set(t.file, []).get(t.file)).push(t);
  const allOn = S.tests.every(t => S.selected.has(t.id)), someOn = S.selected.size > 0;
  el.innerHTML = `<table>
    <thead><tr><th class="check" title="Select all" style="cursor:pointer"><input type="checkbox" ${allOn ? 'checked' : ''} data-ind="${!allOn && someOn}"></th><th>Test</th><th>Last result</th><th class="num">Duration</th></tr></thead>
    <tbody>${[...byFile].map(([file, list]) => {
      const n = list.filter(t => S.selected.has(t.id)).length;
      // A file heading only helps when it groups several tests; each row already shows its file.
      return (list.length < 2 ? '' : `<tr class="file-row" data-file="${esc(file)}"><td class="check"><input type="checkbox" ${n === list.length ? 'checked' : ''} data-ind="${n > 0 && n < list.length}"></td><td colspan="3">${esc(file)} <span class="loc">· ${list.length} tests</span></td></tr>`) +
        list.map(t => {
          const res = lastResult(t.id);
          return `<tr data-id="${esc(t.id)}">
            <td class="check"><input type="checkbox" ${S.selected.has(t.id) ? 'checked' : ''}></td>
            <td><div>${esc(t.titlePath.join(' › '))}</div><div class="loc mono">${esc(t.file)}:${t.line}</div></td>
            <td>${res ? `<a class="last" href="#results=${esc(res.runId || S.liveId)}" title="Open this run"><span class="dot ${esc(triage(res))}"></span>${esc(LABEL[triage(res)] || res.state)}</a>` : '<span class="loc">Not run yet</span>'}</td>
            <td class="num">${res ? fmtDur(res.duration) : ''}</td>
          </tr>`;
        }).join('');
    }).join('')}</tbody></table>`;
  el.querySelectorAll('[data-ind=true]').forEach(c => c.indeterminate = true);
}

// ---------- Run ----------
function shownResults() {
  const r = viewed(); if (!r) return [];
  return Object.values(r.tests)
    .filter(t => S.resultFilter === 'all' || FILTER_GROUPS[S.resultFilter]?.includes(triage(t)))
    .sort((a, b) => (ORDER[triage(a)] - ORDER[triage(b)]) || a.file.localeCompare(b.file) || a.line - b.line);
}

function renderRun() {
  const head = $('#runHead'), body = $('#runBody'); if (!head) return;
  const r = viewed();
  if (!r && S.loading) { head.innerHTML = '<div class="empty">Loading…</div>'; body.innerHTML = ''; return; }
  if (!r) { head.innerHTML = `<div class="empty">This run could not be found. <a href="#results">Back to all results</a></div>`; body.innerHTML = ''; return; }
  const list = Object.values(r.tests), c = counts(r), total = list.length;
  const elapsed = (r.endedAt || Date.now()) - r.startedAt;
  head.innerHTML = `<div class="run-head">
    <div class="run-title">
      <span class="pill ${esc(runState(r.status, c))}"><span class="dot ${esc(runState(r.status, c))}"></span>${esc(LABEL[runState(r.status, c)])}</span>
      ${r.id === S.liveId ? `<span class="live-now" id="runLiveText">${esc(liveStatus(r, true))}</span>` : ''}
      <span class="when">${esc(fmtTime(r.startedAt))}</span>
      <span class="cmd mono">${esc(r.command || '')}</span>
      ${r.id === S.liveId ? `<span class="spacer"></span><button class="btn small danger" data-stop title="Stop this run"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>Stop</button>` : ''}
    </div>
    <div class="stats">
      <div class="stat"><div class="label">Tests</div><div class="value">${total}</div></div>
      <div class="stat running" title="Running now or waiting to run (same as the Running tab)"><div class="label">Running</div><div class="value">${c.running + c.queued}</div></div>
      <div class="stat passed"><div class="label">Passed</div><div class="value">${c.passed}</div></div>
      <div class="stat investigate"><div class="label">Triage needed</div><div class="value">${c.investigate}</div></div>
      <div class="stat bugged"><div class="label">Bugged</div><div class="value">${c.bugged}</div></div>
      ${c.skipped + c.stopped ? `<div class="stat"><div class="label">Skipped</div><div class="value">${c.skipped + c.stopped}</div></div>` : ''}
      <div class="stat"><div class="label">Duration</div><div class="value" id="runElapsed">${fmtDur(elapsed)}</div></div>
    </div>
    <div class="bar">${barHtml(c, total)}</div>
  </div>`;

  // Keep the detail panel and console scroll positions across live re-renders.
  const detailScroll = body.querySelector('.detail-body')?.scrollTop || 0;
  const oldDetail = body.querySelector('.split')?.lastElementChild || null;
  const logEl = body.querySelector('#log');
  const stick = !logEl || logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 20;
  const errs = r.errors || [];
  const tabs = `<div class="tabs" style="padding:0;margin-bottom:12px">
    <button data-rtab="results" class="${S.runTab === 'results' ? 'active' : ''}">Tests <span class="n">${total}</span></button>
    <button data-rtab="console" class="${S.runTab === 'console' ? 'active' : ''}">Console</button>
    ${errs.length ? `<button data-rtab="errors" class="${S.runTab === 'errors' ? 'active' : ''}">Run errors <span class="n">${errs.length}</span></button>` : ''}
  </div>`;

  if (S.runTab === 'console') {
    body.innerHTML = tabs + `<section class="panel console"><pre id="log" class="mono">${esc(r.log || 'No output yet.')}</pre></section>`;
    const l = $('#log'); if (stick) l.scrollTop = l.scrollHeight; else l.scrollTop = logEl.scrollTop;
    return;
  }
  if (S.runTab === 'errors' && errs.length) {
    body.innerHTML = tabs + `<section class="panel" style="padding:16px;display:grid;gap:10px">${errs.map(e => `<pre class="error mono">${esc(e.message || e.stack)}</pre>`).join('')}</section>`;
    return;
  }

  const shown = shownResults();
  // During a live run, follow the first failure (or the running test) until the user picks one.
  const follow = r.id === S.liveId && !S.userPicked;
  if (follow || !S.picked || !r.tests[S.picked] || !shown.some(t => t.id === S.picked)) {
    const next = (shown.find(isFail) || (follow && shown.find(t => t.state === 'running')) || shown[0])?.id || null;
    if (next !== S.picked) { S.picked = next; S.detailTab = null; }
  }
  const isLive = r.id === S.liveId;
  body.innerHTML = tabs + `<div class="split">
    <section class="panel">
      <div class="panel-head">
        <div class="seg">
          <button data-filter="all" class="${S.resultFilter === 'all' ? 'active' : ''}">All (${list.length})</button>
          <button data-filter="running" class="${S.resultFilter === 'running' ? 'active' : ''}" title="Running now or waiting to run">${c.running + c.queued ? '<span class="dot running"></span> ' : ''}Running (${c.running + c.queued})</button>
          <button data-filter="investigate" class="${S.resultFilter === 'investigate' ? 'active' : ''}">Triage needed (${c.investigate})</button>
          <button data-filter="bugged" class="${S.resultFilter === 'bugged' ? 'active' : ''}">Bugged (${c.bugged})</button>
          <button data-filter="passed" class="${S.resultFilter === 'passed' ? 'active' : ''}">Passed (${c.passed})</button>
          ${c.skipped + c.stopped ? `<button data-filter="skipped" class="${S.resultFilter === 'skipped' ? 'active' : ''}" title="Did not run, e.g. the run was stopped">Skipped (${c.skipped + c.stopped})</button>` : ''}
        </div>
        ${c.investigate && !isLive ? (() => {
          const room = list.filter(t => triage(t) === 'investigate' && canRetry(t)).length;
          return `<span class="spacer"></span><span class="tip" title="${room ? '' : `Attempt data full (${MAX_ATTEMPTS}/${MAX_ATTEMPTS}) for every test that needs triage. Please delete data from an attempt to retry.`}"><button class="btn small" data-retry-all ${room ? '' : 'disabled'} title="${room ? `Retry every test that needs triage, inside this run${room < c.investigate ? ` (${c.investigate - room} with ${MAX_ATTEMPTS}/${MAX_ATTEMPTS} attempt data stored are skipped)` : ''}` : `Every test that needs triage has ${MAX_ATTEMPTS}/${MAX_ATTEMPTS} attempt data stored. Delete attempt data to retry.`}">↻ Retry all (${room})</button></span>`;
        })() : ''}
      </div>
      <div class="list">${shown.length ? shown.map(t => `
        <button class="item ${t.id === S.picked ? 'active' : ''}" data-pick="${esc(t.id)}">
          <span class="dot ${esc(triage(t))}" title="${esc(LABEL[triage(t)])}"></span>
          <span class="name">${esc(t.titlePath.join(' › '))}</span>
          <span class="dur">${fmtDur(t.duration)}</span>
          <span class="meta"><span class="loc mono">${esc(t.file)}:${t.line}</span>${(t.attempts?.length || 0) > 1 ? `<span class="loc">· ${t.attempts.length} attempts</span>` : ''}${t.steps?.length ? `<span class="ticks" title="${esc(t.steps.map(s => s.title + ': ' + (s.state || '')).join('\n'))}">${t.steps.map(s => `<i class="${esc(s.state)}"></i>`).join('')}</span>` : ''}</span>
        </button>`).join('') : `<div class="empty">${S.resultFilter === 'running' ? 'Nothing is running in this run. Retry a test that needs triage, or start a run from the Tests page.' : 'Nothing to show.'}</div>`}</div>
    </section>
    <div id="detailSlot"></div>
  </div>`;
  // Reuse the existing detail panel when nothing in it changed, so a playing video isn't restarted
  // by live updates for other tests.
  const detailHtml = S.picked ? renderDetail(r.tests[S.picked]) : '<section class="panel"><div class="empty">Select a test to see details.</div></section>';
  const slot = body.querySelector('#detailSlot');
  if (oldDetail && detailHtml === S.lastDetailHtml) slot.replaceWith(oldDetail);
  else { slot.outerHTML = detailHtml; const db = body.querySelector('.detail-body'); if (db) db.scrollTop = detailScroll; }
  S.lastDetailHtml = detailHtml;
  if (S.detailTab === 'code' && S.codeTarget) mountCode(S.codeTarget.test, S.codeTarget.view);
  if (S.detailTab === 'video') wireVideoActions();
}

// Playwright's error-context (a text snapshot of the page at the failure) is kept with the run as
// input for AI analysis, but isn't shown in the UI.
const aiOnly = a => a.name === 'error-context';

function detailTabs(t) {
  const shots = (t.attachments || []).filter(a => a.file && a.contentType?.startsWith('image/'));
  const videos = (t.attachments || []).filter(a => a.file && a.contentType?.startsWith('video/'));
  const files = (t.attachments || []).filter(a => !videos.includes(a) && !aiOnly(a));
  const tabs = [];
  if (t.errors?.length) tabs.push(['error', 'Logs']);
  if (videos.length) tabs.push(['video', 'Video']);
  if (t.file && !['queued'].includes(t.state)) tabs.push(['code', 'Code']);
  if (files.length) tabs.push(['artifacts', 'Artifacts', files.length]);
  if (isFail(t) || (t.attempts || []).some(a => a.state === 'failed')) tabs.push(['ai', 'AI analysis']);
  return { tabs, shots, videos };
}

// Every attempt of a test in this run (failed attempts plus retries), including one in progress.
function attemptsOf(t) {
  const list = [...(t.attempts || [])].sort((a, b) => a.retry - b.retry);
  if (t.state === 'running' && !list.some(a => a.retry === (t.retry || 0))) list.push({ retry: t.retry || 0, state: 'running', steps: t.steps, errors: [], attachments: [] });
  return list;
}

function renderDetail(test) {
  // Show one attempt at a time: the one the user picked, else the latest.
  const attempts = attemptsOf(test);
  const shown = (S.attemptFor === test.id && attempts.find(a => a.retry === S.attempt)) || attempts.at(-1) || null;
  const t = shown ? { ...test, ...shown, state: test.state } : test;
  const { tabs, shots, videos } = detailTabs(t);
  if (!tabs.some(([k]) => k === S.detailTab)) S.detailTab = tabs[0]?.[0] || null;
  const fileUrl = f => `/api/runs/${encodeURIComponent(S.viewedId)}/files/${encodeURIComponent(f)}`;
  const failedStep = t.steps?.find(s => s.state === 'failed');
  let content = '';
  if (S.detailTab === 'error') {
    content = `${failedStep ? `<div class="callout"><span class="dot failed"></span>Failed in step “${esc(failedStep.title)}”</div>` : ''}
      ${t.errors.map(e => `<div>
        ${e.location ? `<div class="section-label mono">${esc(e.location.file.split(/[\\/]/).slice(-2).join('/'))}:${e.location.line}:${e.location.column}</div>` : ''}
        <pre class="error mono">${esc(e.message || e.value)}</pre>
        ${e.snippet ? `<pre class="mono snippet" style="margin-top:8px">${esc(e.snippet)}</pre>` : ''}
      </div>`).join('')}`;
  } else if (S.detailTab === 'code') {
    // The editor itself is a persistent element moved into this slot after rendering (see mountCode).
    content = '<div id="codeSlot"></div>';
    S.codeTarget = { test, view: t };
  } else if (S.detailTab === 'artifacts') {
    const others = (t.attachments || []).filter(a => !shots.includes(a) && !videos.includes(a) && !aiOnly(a));
    content = `${shots.length ? `<div class="shots">${shots.map(a => `<a class="shot" href="${fileUrl(a.file)}" target="_blank" rel="noopener"><img loading="lazy" src="${fileUrl(a.file)}" alt="${esc(a.name)}"></a>`).join('')}</div>` : ''}
      ${others.length ? `<div class="links">${others.map(a => a.name === 'trace' && a.file ? `<button class="btn small" data-trace="${esc(a.file)}">Open trace viewer</button>` : a.file ? `<a class="btn small" href="${fileUrl(a.file)}" target="_blank" rel="noopener">${esc(a.name)}</a>` : '').join('')}</div>` : ''}`;
  } else if (S.detailTab === 'video') {
    content = '<div class="video-layout">' + videos.slice(0, 1).map(a => `<div class="video-box">
        ${videoTag(fileUrl(a.file), 'video')}
        <div class="banner" hidden>This browser can't play the recording. Open this run in your normal browser instead.
          <div class="links" style="margin-top:8px"><button class="btn small" data-open-external>Open in your browser</button></div></div>
      </div>`).join('') + renderActionList(t) + '</div>';
  } else if (S.detailTab === 'ai') {
    content = renderAnalysis(t);
  }
  const notes = (t.annotations || []).filter(a => a.description).map(a => `<div class="warn">${esc(a.type)}: ${esc(a.description)}</div>`).join('');
  // Triage actions are offered once the run (or its retry) has finished.
  const tri = triage(test);
  const actions = S.viewedId === S.liveId ? ''
    : tri === 'investigate' ? `<div class="actions">${canRetry(test) ? '<button class="btn small primary" data-retry title="Run this test again inside this run">↻ Retry</button><button class="btn small" data-retry-headed title="Retry with a visible browser that stays open when the test ends, with the Playwright Inspector, so you can look around the app. Press Resume or close the browser to finish. Test data cleanup is skipped so the app still shows it; the next normal run removes it.">↻ Retry headed</button>' : `<span class="tip" title="Attempt data full (${MAX_ATTEMPTS}/${MAX_ATTEMPTS}). Please delete data from an attempt to retry."><button class="btn small primary" data-retry disabled>↻ Retry</button> <button class="btn small" data-retry-headed disabled>↻ Retry headed</button></span>`}<button class="btn small" data-bug title="Link this failure to a new or existing bug report">Mark as bugged…</button>${canRetry(test) ? '' : `<span class="warn">${MAX_ATTEMPTS}/${MAX_ATTEMPTS} attempt data stored. Delete attempt data to retry.</span>`}</div>`
    : tri === 'bugged' ? `<div class="actions"><a class="buglink" href="#bugs=${esc(test.bug.id)}">${bugLabel(test.bug.number)} · ${esc(test.bug.title)}</a><button class="btn small" data-unbug title="Remove from the report; the test needs triage again">Unmark</button></div>` : '';
  return `<section class="panel detail">
    <div class="detail-head">
      <h2>${esc(t.titlePath.join(' › '))}</h2>
      <div class="row">
        <span class="pill ${esc(tri)}"><span class="dot ${esc(tri)}"></span>${esc(LABEL[tri] || tri)}</span>
        <span class="mono">${esc(t.file)}:${t.line}</span>
        ${t.duration != null ? `<span>${fmtDur(t.duration)}</span>` : ''}
        ${attemptCount(test) ? `<span title="Attempt data stored for this test in this run (max ${MAX_ATTEMPTS})" style="${canRetry(test) ? '' : 'color:var(--warn)'}">${attemptCount(test)}/${MAX_ATTEMPTS} attempt data stored</span>` : ''}
      </div>
      ${attempts.length > 1 ? `<div class="attempt-row"><div class="seg attempts">${attempts.map(a => `<button data-attempt="${a.retry}" class="${a.retry === shown?.retry ? 'active' : ''}"><span class="dot ${esc(a.state)}"></span> Attempt ${a.retry + 1}${a.duration != null ? ` · ${fmtDur(a.duration)}` : ''}</button>`).join('')}</div></div>` : ''}
      ${actions}
      ${notes}
    </div>
    ${tabs.length ? `<div class="tabs">${tabs.map(([k, label, n]) => `<button data-dtab="${k}" class="${S.detailTab === k ? 'active' : ''}">${label}${n ? ` <span class="n">${n}</span>` : ''}</button>`).join('')}${
      // Delete the shown attempt's data; sits at the end of the tab row. Needs a second click to confirm.
      attempts.length > 1 && S.viewedId !== S.liveId && shown && shown.state !== 'running' ? (() => {
        const confirming = S.confirmDelete === test.id + ':' + shown.retry;
        return `<button class="tab-action" data-del-attempt="${shown.retry}" title="Delete this attempt's result, logs, video and screenshots"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>${confirming ? `Click again to delete attempt ${shown.retry + 1} data` : `Delete attempt ${shown.retry + 1} data`}</button>`;
      })() : ''}</div>
    <div class="detail-body${S.detailTab === 'video' ? ' video-tab' : ''}">${content}</div>` : `<div class="detail-body"><div class="empty">${t.state === 'running' ? 'Running…' : t.state === 'queued' ? 'Waiting to run.' : 'No details recorded.'}</div></div>`}
